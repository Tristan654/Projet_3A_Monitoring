groups:
  - name: network-alerts
    rules:

    # ========= PORT DOWN =========
    - alert: InterfaceDown
      expr: ifOperStatus == 2
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Port DOWN sur {{ $labels.instance }} (ifIndex={{ $labels.ifIndex }})"
        description: "L’interface {{ $labels.ifIndex }} est passée DOWN."

    # ========= TRAFIC ANORMALEMENT ÉLEVÉ =========
    - alert: TrafficHigh
      expr: rate(ifHCInOctets[5m]) * 8 > 500000000 OR rate(ifHCOutOctets[5m]) * 8 > 500000000
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Trafic très élevé sur {{ $labels.instance }}"
        description: "Trafic > 500 Mbps détecté sur le port {{ $labels.ifIndex }}."

    # ========= TAUX D’ERREURS ÉLEVÉS =========
    - alert: InterfaceErrors
      expr: rate(ifInErrors[5m]) > 10 OR rate(ifOutErrors[5m]) > 10
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "Erreurs réseau détectées"
        description: "Le port {{ $labels.ifIndex }} voit plus de 10 erreurs / sec."

    # ========= SWITCH / ROUTEUR A REDÉMARRÉ =========
    - alert: DeviceRestart
      expr: sysUpTime < 60000
      for: 10s
      labels:
        severity: info
      annotations:
        summary: "L’appareil {{ $labels.instance }} vient de redémarrer"
        description: "sysUpTime indique un reboot récent (< 1 minute)."

    # ========= UPLINK SATURÉ =========
    - alert: UplinkSaturation
      expr: rate(ifHCInOctets[5m]) * 8 > 900000000
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Uplink saturé sur {{ $labels.instance }}"
        description: "Le port {{ $labels.ifIndex }} dépasse 900 Mbps."
