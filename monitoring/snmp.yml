auths:
  public_v2:
    version: 2
    community: public

modules:
  ubiquiti:
    walk:
      # ===== SYSTEM =====
      - 1.3.6.1.2.1.1          # system (uptime, descr, name)

      # ===== INTERFACES =====
      - 1.3.6.1.2.1.2          # ifTable
      - 1.3.6.1.2.1.31         # ifXTable (64-bit counters)

      # ===== ERRORS =====
      - 1.3.6.1.2.1.2.2.1.14   # ifInErrors
      - 1.3.6.1.2.1.2.2.1.20   # ifOutErrors

      # ===== UBIQUITI ENTERPRISE =====
      - 1.3.6.1.4.1.41112

    metrics:
      # SYSTEM
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: counter

      # INTERFACE STATUS
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge #valeur qui peut changer au cour du temps 
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: ifAdminStatus
        oid: 1.3.6.1.2.1.2.2.1.7
        type: gauge
        indexes:
          - labelname: ifIndex
            type: gauge

      # TRAFFIC (64 bits)
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge

      # PACKETS
      - name: ifInUcastPkts
        oid: 1.3.6.1.2.1.2.2.1.11
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: ifOutUcastPkts
        oid: 1.3.6.1.2.1.2.2.1.17
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge

      # ERRORS
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge
