auths:
  public_v2:                   # Profil SNMP utilisé par défaut si aucun autre n’est spécifié
    version: 2                 # SNMPv2c : recommandé pour la majorité des équipements (rapide, simple)
    community: public          # Community string permettant d’accéder aux OID du device
    security_level: noAuthNoPriv  # Obligatoire dans la structure, mais sans effet en SNMPv2c
    auth_protocol: MD5         # Paramètres SNMPv3 -> ignorés ici (SNMPv2c ne les utilise pas)
    priv_protocol: DES         # Pareil : ignoré en SNMPv2c

modules:
  default:                     # Module générique : informations système + interfaces
    walk:
      - 1.3.6.1.2.1.1          # SYSTEM-MIB : uptime, hostname, description du device
      - 1.3.6.1.2.1.2          # IF-MIB : liste des interfaces et état basique

  if_mib:                      # Module spécialisé pour la supervision des interfaces réseau
    walk:
      - 1.3.6.1.2.1.2          # IF-MIB classique : statut, erreurs, octets, paquets
      - 1.3.6.1.2.1.31         # IF-MIB étendue : compteurs 64 bits (indispensable sur >1Gbps)

  host_resources:              # Module idéal pour les serveurs ou équipements exposant HostResources
    walk:
      - 1.3.6.1.2.1.25         # HOST-RESOURCES-MIB : CPU, mémoire, stockage, processeurs logiques
